quarkus.http.port=8081
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/notification_platform
quarkus.datasource.username=tech_challenge4
quarkus.datasource.password=grupo13
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.locations=db/migration,db/seed
quarkus.hibernate-orm.schema-management.strategy=none
# Notification channel: EMAIL or GCP_PUBSUB
notification.channel=EMAIL
# Quarkus Mailer (SMTP) - used when notification.channel=EMAIL
quarkus.mailer.host=smtp.mailtrap.io
quarkus.mailer.port=2525
quarkus.mailer.username=
quarkus.mailer.password=
quarkus.mailer.from=no-reply@feedback-platform.com
quarkus.mailer.mock=false
# Dev profile: use Mailpit (localhost:1025) instead of mock or real SMTP
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=1025
%dev.quarkus.mailer.username=
%dev.quarkus.mailer.password=
%dev.quarkus.mailer.start-tls=DISABLED
%dev.quarkus.mailer.login=NONE
%dev.quarkus.mailer.mock=false
# GCP Pub/Sub - used when notification.channel=GCP_PUBSUB
# gcp.project-id=your-project-id (required when notification.channel=GCP_PUBSUB)
gcp.pubsub.topic-id=feedback-critical-alerts
# Kafka
kafka.bootstrap.servers=localhost:9092
mp.messaging.incoming.feedback-created.connector=smallrye-kafka
mp.messaging.incoming.feedback-created.topic=feedback.created
mp.messaging.incoming.feedback-created.group.id=notification-function
mp.messaging.incoming.feedback-created.value.deserializer=br.com.fiap.notification.adapter.input.messaging.FeedbackEventDTODeserializer
# Test profile
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=db/migration
%test.quarkus.hibernate-orm.database.generation=none
%test.gcp.project-id=test-project
%test.gcp.pubsub.topic-id=test-topic
%test.quarkus.mailer.mock=true
%test.mp.messaging.incoming.feedback-created.enabled=false