quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/feedback_platform
quarkus.datasource.username=tech_challenge4
quarkus.datasource.password=grupo13
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.schema-management.strategy=none
# Kafka
quarkus.kafka.devservices.enabled=false
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:9092
mp.messaging.outgoing.feedback-created.connector=smallrye-kafka
mp.messaging.outgoing.feedback-created.topic=feedback.created
mp.messaging.outgoing.feedback-created.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
# Test configuration
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=db/migration
%test.quarkus.hibernate-orm.database.generation=none
# Isso é necessário porque o Cloud Run injeta a variável PORT, e o container precisa ouvir em 0.0.0.0.
quarkus.http.host=0.0.0.0
# Ambiente de producao
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql:///${DB_NAME}
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.socketFactory=com.google.cloud.sql.postgres.SocketFactory
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.cloudSqlInstance=${INSTANCE_CONNECTION_NAME}
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.ipTypes=PUBLIC,PRIVATE
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.cloudSqlRefreshStrategy=lazy
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.hibernate-orm.schema-management.strategy=none